name: Hermes consumer roadmap work
description: Track work that advances the upstream-first consumer product roadmap.
title: "[Hermes Consumer] "
body:
  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap milestone
      options:
        - M0 — Product Reset
        - M1 — Thin Consumer Path
        - M2 — Minimal Consumer Product Layer
        - M3 — Multi-User Isolation and Provisioning
        - M4 — Production Web Release
        - M5 — Product Economics and Growth Layer
        - V2+ — Additional Distribution Channels
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - Consumer web
        - Hermes API integration
        - Nous Portal / Hermes Cloud
        - Identity / credential mediation
        - Provisioning / isolation
        - Infrastructure
        - Future channel
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Capability advanced
      description: What user or product capability does this move forward?
    validations:
      required: true
  - type: textarea
    id: upstream_gap
    attributes:
      label: Upstream capability and gap
      description: What does Hermes/Nous already provide, and what verified gap requires custom work here?
    validations:
      required: true
  - type: textarea
    id: debt
    attributes:
      label: Temporary infrastructure or debt
      description: List any shortcuts and their replacement/removal path.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior required to call this work complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Tests, commands, or real-Hermes end-to-end flows that prove the acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: I checked PROJECT.md, STATE.md, ROADMAP.md, and ARCHITECTURE.md.
          required: true
        - label: I verified whether Hermes/Nous already provides the proposed capability before adding custom infrastructure.
          required: true
        - label: This work does not put credentials or tokens into browser code, source, prompts, logs, issues, or model-visible results.
          required: true
        - label: Unsupported or unverified upstream capabilities will be reported explicitly rather than fabricated.
          required: true
