name: ChatGPT harness roadmap work
description: Track work that advances the plugin-first, upstream-harness-first roadmap.
title: "[Harness Plugin] "
body:
  - type: dropdown
    id: milestone
    attributes:
      label: Roadmap milestone
      options:
        - M0 — DevDay 2026 Product Reset
        - M1 — Plus Personal Plugin Proof
        - M2 — Hermes Plugin End-to-End
        - M3 — User Authentication and Isolation
        - M4 — Public Plugin Package and Submission
        - M5 — Events and Native Plugin UX
        - M6 — OpenClaw Second Harness
        - M7 — Product Economics and Growth
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - ChatGPT plugin package
        - MCP service
        - Hermes adapter / API
        - Nous Portal / Hermes Cloud
        - OAuth / identity / authorization
        - Runtime infrastructure
        - OpenClaw
        - Diagnostics web surface
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Capability advanced
      description: What user or product capability does this move forward?
    validations:
      required: true
  - type: textarea
    id: upstream_gap
    attributes:
      label: Native capability and verified gap
      description: What do OpenAI and the selected harness already provide, and what verified gap requires custom work here?
    validations:
      required: true
  - type: textarea
    id: debt
    attributes:
      label: Temporary infrastructure or debt
      description: List any shortcuts and their replacement/removal path.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior required to call this work complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Tests, commands, or real ChatGPT/MCP/Hermes flows that prove the acceptance criteria.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: I checked PROJECT.md, STATE.md, ROADMAP.md, and ARCHITECTURE.md.
          required: true
        - label: I verified whether OpenAI or the selected harness already provides the proposed capability before adding custom infrastructure.
          required: true
        - label: This work does not put credentials or tokens into plugin packages, browser code, source, prompts, logs, issues, or model-visible results.
          required: true
        - label: Unsupported or unverified upstream capabilities will be reported explicitly rather than fabricated.
          required: true
