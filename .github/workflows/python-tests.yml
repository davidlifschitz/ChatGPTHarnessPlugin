name: M1 tests

on:
  push:
    branches:
      - main
      - product-reset/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hermes probe unit tests
        run: python -m unittest -v tests.test_hermes_probe

      - name: Compile Hermes probe
        run: python -m py_compile tools/hermes_probe.py tests/test_hermes_probe.py

      - name: Verify Hermes probe CLI help
        run: python tools/hermes_probe.py --help

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run web surface tests
        run: node --test tests/web/*.test.js

      - name: Check server-side JavaScript syntax
        run: |
          node --check lib/hermes.js
          node --check api/status.js
          node --check api/chat.js
