name: Repository tests

on:
  push:
    branches:
      - main
      - product-reset/**
      - m1/**
      - m2/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Hermes probe unit tests
        run: python -m unittest -v tests.test_hermes_probe

      - name: Compile Hermes probe
        run: python -m py_compile tools/hermes_probe.py tests/test_hermes_probe.py runtime/hermes/bridge.py

      - name: Verify Hermes probe CLI help
        run: python tools/hermes_probe.py --help

      - name: Check Hermes runtime shell syntax
        run: sh -n runtime/hermes/start-hermes.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run web and MCP tests
        run: npm test

      - name: Check server-side JavaScript syntax
        run: npm run check
